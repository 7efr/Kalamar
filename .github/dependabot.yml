# Dependency update pull requests: once a month, one pull request per ecosystem with every update grouped in it.
# Dependabot's own commit messages ("Bump x from 1.0 to 1.1") already follow the project's convention. Every update
# must still pass CI, and a new or changed license shows in docs/third-party-dependencies.md (regenerate it with
# python scripts/third-party-inventory.py).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /launcher/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ["*"]
    labels: [dependencies, "area: launcher"]

  - package-ecosystem: npm
    directory: /launcher
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies, "area: launcher"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, "area: ci"]
